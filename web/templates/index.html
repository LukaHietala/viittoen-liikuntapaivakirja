<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script defer
				src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js">
		</script>
        <link rel="stylesheet" href="static/styles.css" />
		<title>Aktiiviset haasteet</title>
		<body x-data="{ showNav: false }">
			<main>
                <nav class="navbar" x-show="$store.session.loggedIn"> 
                    <div class="navbar-row">
                        <div class="desktop">
                            <a href="/" class="btn-link active-nav-item">Etusivu</a>
                            <a href="/profile" class="btn-link">Profiili</a>
                            <a href="/challenges" class="btn-link">Haasteet</a>
                            <a href="/admin" x-show="$store.session.admin"
							   class="btn-link" x-cloak>
                                Ylläpitäjälle
                            </a>
                        </div>
                        <div class="desktop">
                            <a href="/logout" class="btn-link">Kirjaudu ulos</a>
                        </div>
                        <div class="mobile"></div>
                        <div class="mobile">
                            <button class="secondary-btn icon-btn"
                                    x-on:click="showNav = !showNav">
                                <img src="/static/menu.svg" alt="Avaa navigaatio" />
                            </button>
                        </div>
                    </div>
                    <!-- MOBILE NAV -->
                    <div x-show="showNav" class="navbar-col" x-transition>
                        <a href="/" class="btn-link active-nav-item">Etusivu</a>
                        <a href="/profile" class="btn-link">Profiili</a>
                        <a href="/challenges" class="btn-link">Haasteet</a>
                        <a href="/admin" x-show="$store.session.admin"
                           class="btn-link" x-cloak>
                            Ylläpitäjälle
                        </a>
						<a href="/logout" class="btn-link">Kirjaudu ulos</a>
                    </div>
                </nav>
				<div class="container">
					<h2 x-show="$store.session.loggedIn">Aktiiviset haasteet</h2>
					<section x-show="!$store.session.loggedIn" style="padding: 15px;">
						<p style="margin: 0;">
							Jos haluat nähdä tai lisätä suorituksia sinun täytyy
							<a href="/login">kirjautua</a>.
							Jos sinulla ei ole käyttäjää pyydä ylläpitäjää luomaan se.
						</p>
					</section>
					<div x-show="$store.state.challenges.length > 0" class="list">
						<template x-for="challenge in $store.state.challenges" >
							<div x-data="{
										 confirm: false,
										 addPoints: 1
										 }">
								<div x-show="!confirm" class="item active">
									<div class="item-info">
										<strong x-text="challenge.title"></strong>
										<span x-text="`- Tavoite: ${challenge.pot}`"></span>
										/
										<span x-text="challenge.goal_points"></span>
										<progress x-bind:max="challenge.goal_points"
												  x-bind:value="`${challenge.pot}`">
											Edistys mittari
										</progress>
									</div>
									<div x-show="$store.session.loggedIn"
										 class="item-actions">
										<button x-show="!confirm"
												x-on:click="confirm = !confirm;
															addPoints = 1">
											Lisää suoritus
										</button>
									</div>
								</div>
								<section x-show="confirm">
                            	    <div style="padding: 15px;
												border-bottom: 1px solid var(--border);">
                                        <strong x-text="challenge.title"></strong><br />
                                        <span x-text="challenge.description"></span>
                                    </div>

									<div style="padding: 15px">
                                        <input x-model.number="addPoints"
											   min="1"
											   type="number"/>
                                        <span x-text="challenge.unit"></span>
									</div>
									<div style="padding: 15px;
												border-top: 1px solid var(--border);">
										<button x-show="confirm"
												x-on:click="confirm = false"
												class="secondary-btn">
											Peruuta
										</button>
										<button x-show="confirm"
												:disabled="parseInt(addPoints)
														   == NaN"
												x-on:click="addPerformance($event,
															addPoints,
															challenge.id);
															confirm = false">
											Vahvista
										</button>
									</div>
								</section>
							</div>
						</template>
					</div>
					<template x-cloak x-if="$store.state.challenges.length == 0">
						<section style="padding: 15px;">
							<span>Ei ole aktiivisia haasteita</span>
						</section>
					</template>
				</div>
			</main>
		</body>
		<script>
			document.addEventListener('alpine:init', async () => {
				Alpine.store('session', {
					loggedIn: false
				});
				
				Alpine.store('state', {
					challenges: [],					
				});

				window.leaderboard = performances => {
					m = new Map();
					performances.map((x) => {
						v = m.get(x.user.name) || 0;
						m.set(x.user.name, v + x.points);
					});
					return m;
				}
				
				async function getChallenges() { 
					try {
						const response = await fetch("/api/challenges/active");
						if (!response.ok) {
							throw new Error("Jotain meni pieleen: " + response.status);
						}
						return await response.json()
					} catch (e) {
    					console.error(e.message);
					}
				}
				
				Alpine.store('state', {
					challenges: await getChallenges(),
				});

				window.addPerformance = async (event, points, challenge_id) => {
					const response = await fetch(`/api/performances`, {
						method: "POST",
						headers: {
							"Content-Type": "application/json"
						},
						body: JSON.stringify({
							points: points,
							challenge_id: challenge_id
						}) 
					});
					Alpine.store('state').challenges = await getChallenges();
				};

				const loggedIn = async (event) => {
					const res = await fetch("/api/session/valid");
					const json = await res.json();
					Alpine.store('session', {
						loggedIn: await json.ok,
						admin: await json.admin
					});
				};
				await loggedIn();
			});
		</script>
</html>
