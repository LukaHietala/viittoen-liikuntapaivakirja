<!DOCTYPE HTML>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
			></script>
		<title>Profiili</title>
		<link rel="stylesheet" href="static/styles.css" />
	</head>
	<body>
		<main x-data="">
            <div class="container">
                <section>
                    <nav class="navbar"> 
                        <div>
							<a href="/" class="btn-link">Etusivu</a>
							<a href="/profile" class="btn-link active-nav-item">
								Profiili
							</a>
							<a href="/challenges" class="btn-link">Haasteet</a>
							<a href="/admin" x-show="$store.session.admin" class="btn-link">
								Ylläpitäjälle
							</a>
                        </div>
                        <div>
							<a href="/logout" class="btn-link">Kirjaudu ulos</a>
                        </div>
                    </nav>
                </section>
                <h2>Profiili</h2>
                <section style="padding: 15px">
                    <span
                        x-text="`Keräämäsi pisteet:
                                ${sumPerformances($store.state.self.performances)}`"
                        >
                    </span>
                </section>
                <!-- LUUKAS ÄLÄ NÄYTÄ JOS EI HAASTEITA -->
                <h3>Suorituksesi</h3>
                <div class="list">
                    <template x-for="performance in $store.state.self.performances">
                        <div x-data="{ challenge: null }">
                            <div class="item">
                                <div class="item-info">
                                    <span>
                                        Pisteet:
                                        <strong x-text="performance.points">
                                        </strong>
                                    </span>
                                    <span>
                                        - Suoritettu
                                        <strong x-text="performance.created_at">
                                        </strong>
                                    </span>
                                </div>
                                <div class="item-actions">
                                    <button x-show="challenge == null"
                                            x-on:click="challenge = await getChallenge(
                                                        $event,
                                                        performance.challenge_id)">
                                        Näytä haaste
                                    </button>
                                    <button x-show="challenge != null"
                                            x-on:click="challenge = null">
                                        Näytä haaste
                                    </button>
                                    <button x-on:click="await deletePerformance(
                                        $event,
                                        performance.id)"
                                        class="secondary-btn icon-btn">
                                        <img src="/static/can.svg" alt="Poista" />
                                    </button>
                                </div>
                            </div>
                            <template x-if="challenge != null">
                                <section style="margin-top: 6px;">
                                    <div style="padding: 15px;">
                                        <strong x-text="challenge.title"></strong><br />
                                        Ajanjakso:
                                        <span x-text="challenge.start_date"></span>
                                        -
                                        <span x-text="challenge.end_date"></span>
                                    </div>
                                </section>
                            </template>
                        </div>
                    </template>
                </div>
                <section x-show="$store.state.self.performances == null ||
                                 $store.state.self.performances.length == 0" style="padding: 15px;">
                    <span>Ei haasteita.</span>
                </section>
            </div>
		</main>
	</body>
	<script type="text/javascript">
		document.addEventListener("alpine:init", async () => {
			Alpine.store('session', {
				loggedIn: false
			});
			
			Alpine.store("state", {
				self: {
					performances: [],
				},
			});

			window.sumPerformances = (performances) => (
				(performances == null ) ?
					0
					: performances.reduce((sum, x) => sum + x.points, 0)
			);

			const getProfile = async (event) => {
				const res = await fetch("/api/self");
				Alpine.store("state", {
					self: await res.json(),
				});
			};
			await getProfile();
			// Challenges
			window.getChallenge = async (e, challenge_id) => {
				try {
					const response = await fetch(`/api/challenges/${challenge_id}`);
					if (!response.ok) {
						throw new Error("Jotain meni pieleen: " + response.status);
					}
					return await response.json();
				} catch (e) {
					console.error(e.message);
				}
			}
			// Performances
			window.deletePerformance = async (e, performance_id) => {
				try {
					const response = await fetch(`/api/performances/${performance_id}`, {
						method: "DELETE",
					});
					if (!response.ok) {
						throw new Error("Jotain meni pieleen: " + response.status);
					}
				} catch (e) {
					console.error(e.message);
				}
				await getProfile();
			}
			// Session
			const loggedIn = async (event) => {
				const res = await fetch("/api/session");
				const json = await res.json();
				Alpine.store('session', {
					loggedIn: await json.ok,
					admin: await json.admin
				});
			};
			await loggedIn();
		});
	</script>
</html>
