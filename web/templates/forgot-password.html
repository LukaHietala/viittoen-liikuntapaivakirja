<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Nollaa salasana</title>
		<link rel="stylesheet" href="static/styles.css" />
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js">
		</script>
	</head>
	<body>
        <main x-data="">
            <div x-show="!$store.state.sent">
                <h2>Unohditko salasanasi?</h2>
                <section x-show="$store.state.error != null"
						 style="padding: 15px;
								margin-bottom: 6px;
								border: 1px solid red !important;">
                    <span x-text="$store.state.error"></span>
                </section>
                <section x-data="">
                    <div style="padding: 15px;">
                        <label>Sähköposti:</label><br>
                        <input type="email" x-model="$store.state.email"/><br>
                    </div>
                    <div style="padding: 15px; border-top: 1px solid var(--border)">
                        <button x-on:click="forgot($event);">Lähetä</button>
                    </div>
                </section>
            </div>
            <div x-show="$store.state.sent">
                <section style="padding: 15px;">
                    <span>Linkki salasanasi nollaukseen lähetettiin sähköpostiisi. Voit sulkea tämän välilehden.</span>
                </section>

            </div>
        </main>
	</body>
	<script type="text/javascript">
		document.addEventListener("alpine:init", async () => {
			Alpine.store('state', {
				email: "",
				sent: false,
				error: null
			});

			window.forgot = async (event) => {
				try {
					const response = await fetch("/forgot-password", {
						method: "POST",
                        body: JSON.stringify({ email: Alpine.store("state").email }),
					});
					if (!response.ok) {
						const json = await response.json();
						Alpine.store('state').error = json.message;
					} else {
						Alpine.store('state').sent = true;
					}
				} catch (e) {
					console.error(e.message);
				}
			};
		});
	</script>
</html>
