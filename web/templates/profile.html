<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" ></script>
		<title>Profiili</title>
        <link rel="stylesheet" href="static/styles.css" />
	</head>
	<body>
        <main x-data="">
            <h2>Profiili (Jaakko)</h2> 
            <section style="padding: 15px;">
                <span x-text="`Keräämäsi pisteet:
							  ${sumPerformances($store.state.self.performances)}`">
				</span>
            </section>
            <!-- LUUKAS ÄLÄ NÄYTÄ JOS EI HAASTEITA -->
            <h3>Suorituksesi</h3>
            <!-- LUUKAS FOR TÄHÄN -->
            <div class="list">
                <div class="item">
                    <div>
                        <span>2026-09-20 11:11:11</span>
                        <span>Pisteet: 1</span>
                    </div>
                    <button>
                        <!-- LUUKAS HAE HAASTE -->
                        Näytä haaste
                    </button>
                </div>
            </div>

        </main>
	</body>
	<script type="text/javascript">
		document.addEventListener('alpine:init', async () => {
			Alpine.store('state', {
				self: {
					performances: []
				}
			});

			window.sumPerformances = (performances) => performances.reduce((sum, x) => sum + x.points, 0);
			
			const getProfile = async (event) => {
				const res = await fetch("/api/self");
				Alpine.store('state', {
					self: await res.json()
				});
			};
			await getProfile();
		});
	</script>
</html>
