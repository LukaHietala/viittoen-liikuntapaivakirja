<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Admin</title>
	</head>
	<body>
		<div>
			<h2>Luo uusi haaste</h2>
			<form action="/api/challenges" method="POST">
				<label for="title">Haasteen nimi:</label><br>
				<input type="text" name="title"/><br>
				<label for="points">Tavoite pisteet:</label><br>
				<input type="text" name="points"/><br>
				<label for="active">Aseta aktiiviseksi:</label><br>
				<input type="checkbox" name="active" value="moi"/><br>
				<button type="submit">Lisää haaste</button>
			</form>
		</div>
		<div>
			<h2>Haasteet</h2>
            {{ if .Challenges }}
			<ul>
				{{ range .Challenges }}
				<li>
					<strong>{{.Title}}</strong>
					- Tavoite: {{.GoalPoints}} 
					- Tila:
					{{ if .IsActive }}
					Aktiivinen
					{{ else }}
					Ei aktiivinen
					{{ end }}
				</li>
				{{ end }}
			</ul>
            {{ else }}
            <p>Ei haasteita</p>
            {{ end }}
		</div>
	</body>
</html>
